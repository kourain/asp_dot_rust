[package]
name = "asp_dot_rust"
version = "0.2.11"
edition = "2024"
authors = ["kourain <maiquyen16503@gmail.com>"]
license = "MIT"
description = "a mini web framework look at ASP.NET Core API"
readme = "README.md"
homepage = "https://github.com/kourain/asp_dot_rust"
repository = "https://github.com/kourain/asp_dot_rust"
exclude = ["tests/"]

[lib]
doctest = false

[build-dependencies]
chrono = "0.4.45"

[dependencies]
arc-swap = "1.9.5"
async-compression = { version = "0.4.52", features = [
    "tokio",
    "gzip",
    "zlib",
    "brotli",
    "zstd",
] }
async-trait = "0.1.92"
chrono = "0.4.45"
colored = "3.1.1"
dashmap = "6.2.1"
futures = "0.3.34"
futures-util = "0.3.34"
inventory = "0.3.25"
hyper = { version = "1.12.0", features = [
    "client",
    "server",
    "http1",
    "http2",
] }
hyper-util = { version = "0.1.21", features = [
    "client",
    "client-legacy",
    "server",
    "tokio",
    "http1",
    "http2",
] }
http-body-util = { version = "0.1.5", features = ["channel"] }
http-body = "1.1.0"
http = "1.5.0"
matchit = "0.9.2"
memchr = "2.8.3"
notify = "8.2.2"
notify-debouncer-full = "0.7.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde_urlencoded = "0.7.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
uuid = { version = "1.29.2", features = ["v7"] }
ulid = "3.0.0"
urlencoding = "2.1.3"

asp_dot_rust_macros = { version = "0.2.8", path = "asp_dot_rust_macros" }
base64 = "0.23.1"
jsonwebtoken = { version = "12.0.0", default-features = true }
