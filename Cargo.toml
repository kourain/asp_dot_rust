[package]
name = "asp_dot_rust"
version = "0.2.1"
edition = "2024"
authors = ["kourain <maiquyen16503@gmail.com>"]
license = "MIT OR GPL-3.0"
description = "hardcode a web framework look at ASP.NET Core API"
readme = "README.md"
homepage = "https://github.com/kourain/asp_dot_rust"
repository = "https://github.com/kourain/asp_dot_rust"

[build-dependencies]
chrono = "0.4.45"

[dependencies]
arc-swap = "1.9.2"
async-trait = "0.1.92"
chrono = "0.4.45"
colored = "3.1.1"
dashmap = "6.2.1"
futures = "0.3.34"
futures-util = "0.3.34"
inventory = "0.3.24"
hyper = { version = "1.11.0", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "server", "tokio", "http1", "http2"] }
http-body-util = { version = "0.1.5", features = ["channel"] }
http-body = "1.1.0"
http = "1.5.0"
matchit = "0.9.2"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.5+spec-1.1.0"
uuid = { version = "1.26.1", features = ["v7"] }
urlencoding = "2.1.3"

asp_dot_rust_macros = { version = "0.2.1", path = "asp_dot_rust_macros" }